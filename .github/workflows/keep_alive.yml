name: Keep Alive Supabase

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Asignar valores por defecto si los secrets no se leen correctamente
          URL="${SUPABASE_URL:-https://xtribcsicgyzjyhvsia.supabase.co}"
          KEY="${SUPABASE_ANON_KEY:-sb_publishable_qr4QprFfqrtklogBhez-Lw_hT9VRAID}"
          
          # Limpiar posibles comillas o espacios extras
          URL=$(echo "$URL" | tr -d '"' | tr -d "'" | xargs)
          KEY=$(echo "$KEY" | tr -d '"' | tr -d "'" | xargs)

          echo "🔄 Enviando petición Keep-Alive a: ${URL}/rest/v1/"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/")

          echo "Status HTTP recibido: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "✅ Conexión exitosa a Supabase (HTTP $HTTP_STATUS)."
            exit 0
          else
            echo "⚠️ La petición respondió con estado HTTP $HTTP_STATUS"
            # Si responde cualquier código HTTP (incluso 401/404), el servidor Supabase ya despertó
            exit 0
          fi
