<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Mi Blog Personal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='form_style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><linearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22><stop offset=%220%25%22 style=%22stop-color:%236366f1%22/><stop offset=%22100%25%22 style=%22stop-color:%23a855f7%22/></linearGradient><circle cx=%2250%22 cy=%2250%22 r=%2248%22 fill=%22url(%23g)%22/><text y=%22.9em%22 x=%2250%22 font-size=%2270%22 text-anchor=%22middle%22 fill=%22white%22>🔒</text></svg>">
</head>
<body>
    <a href="{{ url_for('blog.index') }}" class="back-link">← Volver al blog</a>

    <div class="form-wrapper">
        <div class="form-card">
            <div class="form-card-header">
                <span class="header-icon">🔐</span>
                <h1>Iniciar Sesión</h1>
                <p class="header-subtitle">Acceso al panel de administración</p>
            </div>

            <div class="form-card-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="{{ url_for('auth.login', next=request.args.get('next', '')) }}" method="POST">
                    <div class="form-group">
                        <label class="form-label" for="username">Usuario</label>
                        <input type="text" id="username" name="username" class="form-control"
                               placeholder="Ingresa tu usuario" required autofocus autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <div class="form-divider"></div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Ingresar al panel →</button>
                        <a href="{{ url_for('blog.index') }}" class="btn-cancel-link">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
